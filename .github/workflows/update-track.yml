name: update-track
# Milan's positions and videos, live: one run keeps going for almost six hours, fetching every
# TRACK_INTERVAL_MINUTES (variable, default 5) and committing what's new (scripts/update-loop.sh), then starts the next
# run itself. GitHub's schedule below is only a safety net: if the chain ever stops, it starts it again within two
# hours (while a run is going, it just waits). Pushing this file (or the loop) starts it right away.
# The feed is set in Settings → Secrets and variables → Actions (see docs/data.md). Without one, positions don't change.
on:
    push:
        branches: [main]
        paths: ['.github/workflows/update-track.yml', 'scripts/update-loop.sh']
    schedule:
        - cron: '7 */2 * * *'
    workflow_dispatch:
permissions:
    contents: write
    actions: write
concurrency:
    group: update-track
    cancel-in-progress: false
jobs:
    update:
        runs-on: ubuntu-latest
        timeout-minutes: 358
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
            - run: npm ci --no-audit --no-fund
            - name: Every few minutes, for almost six hours - positions and videos
              env:
                  TRACK_FEED_TYPE: ${{ vars.TRACK_FEED_TYPE }}
                  TRACK_FEED_URL: ${{ vars.TRACK_FEED_URL }}
                  TRACK_FEED_PASSWORD: ${{ secrets.TRACK_FEED_PASSWORD }}
                  TRACK_FEED_EVENT: ${{ vars.TRACK_FEED_EVENT }}
                  TRACK_FEED_SPEED: ${{ vars.TRACK_FEED_SPEED }}
                  OFFICIAL_CHECK: ${{ vars.OFFICIAL_CHECK }}
                  TRACK_INTERVAL_MINUTES: ${{ vars.TRACK_INTERVAL_MINUTES || '5' }}
              run: bash scripts/update-loop.sh
            # the next run takes over (a run started with this workflow's own token may start another one this way)
            - name: Start the next run
              if: ${{ !cancelled() }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh workflow run update-track.yml --ref main
